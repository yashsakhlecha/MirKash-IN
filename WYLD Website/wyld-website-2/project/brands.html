const { useState, useEffect, useRef } = React;

/* ── HELPERS ── */
function useIsMobile() {
  const [m, setM] = useState(window.innerWidth <= 768);
  useEffect(() => {
    const fn = () => setM(window.innerWidth <= 768);
    window.addEventListener('resize', fn, { passive: true });
    return () => window.removeEventListener('resize', fn);
  }, []);
  return m;
}

function useScrolled(threshold = 60) {
  const [s, setS] = useState(false);
  useEffect(() => {
    const fn = () => setS(window.scrollY > threshold);
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, [threshold]);
  return s;
}

function useInView(ref, threshold = 0.2) {
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVis(true); }, { threshold });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return vis;
}

function useCountUp(target, active, dur = 1800) {
  const [v, setV] = useState(0);
  useEffect(() => {
    if (!active) return;
    let s = 0; const step = target / (dur / 16);
    const t = setInterval(() => { s += step; if (s >= target) { setV(target); clearInterval(t); } else setV(Math.floor(s)); }, 16);
    return () => clearInterval(t);
  }, [active, target]);
  return v;
}

/* ── S11: CONTACT FORM ── */
function ContactForm() {
  const mob = useIsMobile();
  const [form, setForm] = useState({ brand: '', category: '', budget: '', email: '', mobile: '', goal: '' });
  const [sent, setSent] = useState(false);

  const CATEGORIES = ['Beauty', 'Fashion', 'F&B', 'Tech', 'Lifestyle', 'Other'];
  const BUDGETS = ['Under ₹50K', '₹50K – ₹2L', '₹2L – ₹10L', '₹10L+'];

  const selStyle = { width: '100%', padding: '13px 16px', borderRadius: 10, border: '1.5px solid #E5E5E5', fontSize: 14, fontFamily: 'Inter,sans-serif', color: '#111', background: '#fff', outline: 'none', appearance: 'none', transition: 'border-color 0.2s' };
  const inputStyle = { ...selStyle };

  const TRUST = [
    { text: 'As seen on Shark Tank India Season 3' },
    { text: 'Official Instagram API Partner' },
    { text: '48-hour campaign go-live' },
  ];

  return (
    <section id="contact" style={{ background: '#0D0D0D', padding: mob ? '72px 20px' : '100px 40px' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto' }}>
        <div style={{ textAlign: 'center', marginBottom: 64 }}>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: 'rgba(244,114,182,0.1)', border: '1px solid rgba(244,114,182,0.25)', borderRadius: 100, padding: '5px 14px', marginBottom: 20 }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: '#F472B6', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Get Started</span>

            Ready to run your first<br />WYLD campaign?
          </h2>
          <p style={{ fontSize: mob ? 15 : 18, color: 'rgba(255,255,255,0.45)', lineHeight: 1.7, maxWidth: 520, margin: '0 auto' }}>
            We onboard a limited number of new brands each month to maintain campaign quality. Tell us about your brand and a WYLD strategist will reach out within 24 hours.
          </p>
        </div>

        <div className="two-col" style={{ display: 'grid', gridTemplateColumns: mob ? '1fr' : '1fr 1fr', gap: 48, alignItems: 'start' }}>
          {/* Form card */}
          {!sent ? (
            <div style={{ background: '#fff', borderRadius: 24, padding: mob ? 28 : 40 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, color: '#555', letterSpacing: '0.04em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Brand / Company Name</label>
                  <input value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} placeholder="Your brand name" style={inputStyle}
                    onFocus={e => e.target.style.borderColor = '#F9A8D4'} onBlur={e => e.target.style.borderColor = '#E5E5E5'} />
                </div>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, color: '#555', letterSpacing: '0.04em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Product Category</label>
                  <div style={{ position: 'relative' }}>
                    <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} style={selStyle}>
                      <option value="">Select category</option>
                      {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <div style={{ position: 'absolute', right: 14, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: '#bbb', fontSize: 12 }}>▾</div>
                  </div>
                </div>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, color: '#555', letterSpacing: '0.04em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Monthly Marketing Budget</label>
                  <div style={{ position: 'relative' }}>
                    <select value={form.budget} onChange={e => setForm({ ...form, budget: e.target.value })} style={selStyle}>
                      <option value="">Select budget range</option>
                      {BUDGETS.map(b => <option key={b} value={b}>{b}</option>)}
                    </select>
                    <div style={{ position: 'absolute', right: 14, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: '#bbb', fontSize: 12 }}>▾</div>
                  </div>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: mob ? '1fr' : '1fr 1fr', gap: 16 }}>
                  <div>
                    <label style={{ fontSize: 12, fontWeight: 700, color: '#555', letterSpacing: '0.04em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Your Work Email</label>

                      onFocus={e => e.target.style.borderColor = '#F9A8D4'} onBlur={e => e.target.style.borderColor = '#E5E5E5'} />
                  </div>
                  <div>
                    <label style={{ fontSize: 12, fontWeight: 700, color: '#555', letterSpacing: '0.04em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Mobile Number</label>
                    <input value={form.mobile} onChange={e => setForm({ ...form, mobile: e.target.value })} placeholder="+91 98765 43210" type="tel" style={inputStyle}
                      onFocus={e => e.target.style.borderColor = '#F9A8D4'} onBlur={e => e.target.style.borderColor = '#E5E5E5'} />
                  </div>
                </div>
                <div>
                  <label style={{ fontSize: 12, fontWeight: 700, color: '#555', letterSpacing: '0.04em', textTransform: 'uppercase', display: 'block', marginBottom: 8 }}>Campaign Goal <span style={{ color: '#bbb', fontWeight: 400, textTransform: 'none' }}>(optional)</span></label>
                  <textarea value={form.goal} onChange={e => setForm({ ...form, goal: e.target.value })} placeholder="Tell us what you're trying to achieve..." rows={3}
                    style={{ ...inputStyle, resize: 'none', lineHeight: 1.6 }}
                    onFocus={e => e.target.style.borderColor = '#F9A8D4'} onBlur={e => e.target.style.borderColor = '#E5E5E5'} />
                </div>
                <button className="btn-primary" onClick={() => { if (form.email) setSent(true); }} style={{ padding: '15px 28px', fontSize: 16, justifyContent: 'center', borderRadius: 12, marginTop: 4 }}>
                  Book a Strategy Call
                      Request a Strategy Call
                </button>
              </div>
            </div>
          ) : (
            <div style={{ background: '#fff', borderRadius: 24, padding: 40, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: 400, textAlign: 'center' }}>
              <div style={{ width: 64, height: 64, borderRadius: '50%', background: 'linear-gradient(135deg,#F472B6,#E91E8C)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 20 }}><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
              <h3 style={{ fontSize: 24, fontWeight: 900, color: '#111', marginBottom: 12 }}>You're in the queue!</h3>
              <p style={{ fontSize: 15, color: '#6B6B6B', lineHeight: 1.7, maxWidth: 300 }}>A WYLD brand strategist will reach out to <strong>{form.email}</strong> within 24 hours.</p>
            </div>
          )}

          {/* Trust signals */}
          <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 28 }}>
            {TRUST.map((t, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 16 }}>
                <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'linear-gradient(135deg,#F472B6,#E91E8C)', flexShrink: 0, marginTop: 8 }}></div>
                <div style={{ fontSize: 16, color: 'rgba(255,255,255,0.7)', fontWeight: 600, lineHeight: 1.5 }}>{t.text}</div>
              </div>
            ))}
            <div style={{ marginTop: 16, paddingTop: 24, borderTop: '1px solid rgba(255,255,255,0.08)' }}>
              <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.3)' }}>Or email us directly:</p>
              <a href="mailto:brands@getwyld.in" style={{ fontSize: 18, fontWeight: 700, color: '#F472B6', textDecoration: 'none', transition: 'color 0.2s' }}
                onMouseEnter={e => e.target.style.color = '#EC4899'} onMouseLeave={e => e.target.style.color = '#F472B6'}>brands@getwyld.in</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}
