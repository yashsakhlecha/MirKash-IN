<style>

  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: #F5F5F7; color: #111111; overflow-x: hidden; }

  /* ── MARQUEE ─────────────────────────────────────────── */
  @keyframes marquee-left  { 0%{transform:translateX(0)}   100%{transform:translateX(-50%)} }
  @keyframes marquee-right { 0%{transform:translateX(-50%)} 100%{transform:translateX(0)} }

  /* ── EXPERIENCE SLIDER ───────────────────────────────── */
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ── BUTTONS ─────────────────────────────────────────── */
  .btn-pink {
    display: inline-flex; align-items: center; gap: 8px;

    transition: all 0.25s ease; position: relative; overflow: hidden;
  }
  .campaign-card::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:3px;
    background: linear-gradient(135deg,#F472B6,#E91E8C);
    transform:scaleX(0); transform-origin:left; transition:transform 0.3s ease;
  }

  .campaign-card:hover::after { transform:scaleX(1); }

  /* ── CREATOR CARD ────────────────────────────────────── */
  .creator-card {
    flex-shrink: 0; border-radius: 16px; overflow: hidden;
    position: relative; background: #eee; transition: transform 0.2s ease;
  }
  .creator-card:hover { transform: scale(1.02); }

  /* ── VISIBILITY ──────────────────────────────────────── */
  @media (max-width: 768px) { .desktop-only { display: none !important; } }
  @media (min-width: 769px) { .mobile-only  { display: none !important; } }

  /* ── GLOBAL MOBILE PADDING ───────────────────────────── */
  @media (max-width: 768px) {
    .section-pad { padding-left: 20px !important; padding-right: 20px !important; }
    .section-pad-top { padding-top: 72px !important; }
    .section-pad-bottom { padding-bottom: 72px !important; }

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const { TweaksPanel, TweakSection, TweakColor, TweakText, TweakToggle, TweakSlider, TweakSelect, useTweaks } = window;

/* ─── TWEAK DEFAULTS ───────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentFrom": "#F472B6",
  "accentTo": "#E91E8C",
  "heroHeadline": "Where Influence\nBecomes Currency",
  "heroSub": "Earn real money from India's top brands — on your terms.",
  "ctaLabel": "Join WYLD",
  "appStoreUrl": "https://apps.apple.com",
  "playStoreUrl": "https://play.google.com",
  "smartDownloadLabel": "Download WYLD",
  "showNumbersStrip": true,
  "showExperiences": true,
  "creatorCountStat": "25,000+"
}/*EDITMODE-END*/;

/* ─── MOBILE HOOK ──────────────────────────────────────────────────────── */
function useIsMobile() {
  const [mob, setMob] = useState(window.innerWidth <= 768);
  useEffect(() => {
    const fn = () => setMob(window.innerWidth <= 768);
    window.addEventListener('resize', fn, { passive: true });
    return () => window.removeEventListener('resize', fn);
  }, []);
  return mob;
}

/* ─── DEVICE OS DETECTION ──────────────────────────────────────────────── */
function getDeviceOS() {
  const ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
  if (/android/i.test(ua)) return 'android';
  return 'other';
}

/* ─── PLACEHOLDER ──────────────────────────────────────────────────────── */
function PlaceholderImg({ label, dark = false }) {
  const bg     = dark ? '#1a1a1a' : '#e8e8e8';
  const stripe = dark ? '#222'    : '#d8d8d8';
  const tc     = dark ? '#555'    : '#aaa';
  const id     = 'p' + (label||'x').replace(/\W/g,'').slice(0,12);
  return (
    <div style={{ position:'absolute', inset:0, overflow:'hidden' }}>
      <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style={{ position:'absolute',inset:0 }}>
        <rect width="100%" height="100%" fill={bg} />
        <defs>
          <pattern id={id} patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(45)">
            <rect width="12" height="24" fill={stripe} />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill={`url(#${id})`} opacity="0.4" />
      </svg>
      <div style={{ position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6 }}>
        <span style={{ fontFamily:'monospace',fontSize:11,color:tc,textAlign:'center',padding:'0 16px',lineHeight:1.5 }}>{label}</span>
      </div>
    </div>
  );
}

/* ─── LOGO ─────────────────────────────────────────────────────────────── */
function WyldLogo({ white = false, height = 30 }) {
  return (
    <img
      src={white ? 'uploads/WYLD logo horizontal-White.png' : 'uploads/WYLD Final Logo-01-cropped.png'}
      alt="WYLD" style={{ height, width:'auto', display:'block' }}
    />
  );
}

/* ─── NAV ──────────────────────────────────────────────────────────────── */
function Nav({ tweaks }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const mob = useIsMobile();

  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', fn, { passive:true });
    return () => window.removeEventListener('scroll', fn);
  }, []);

  // Close menu on desktop resize
  useEffect(() => { if (!mob) setMenuOpen(false); }, [mob]);

  const bg = (scrolled || menuOpen) ? 'rgba(255,255,255,0.97)' : 'transparent';
  const shadow = (scrolled || menuOpen) ? '0 1px 0 rgba(0,0,0,0.08)' : 'none';
  const linkColor = (scrolled || menuOpen) ? '#111' : '#fff';

  return (
    <nav style={{ position:'fixed',top:0,left:0,right:0,zIndex:1000, background:bg, backdropFilter:(scrolled||menuOpen)?'blur(12px)':'none', boxShadow:shadow, transition:'background 0.3s,box-shadow 0.3s' }}>
      <div style={{ maxWidth:1440,margin:'0 auto',padding: mob ? '0 20px' : '0 40px',height: mob ? 60 : 72,display:'flex',alignItems:'center',justifyContent:'space-between' }}>
        <WyldLogo white={!(scrolled||menuOpen)} height={mob ? 26 : 30} />

        {/* Desktop links */}
        <div className="desktop-only" style={{ display:'flex',gap:40,alignItems:'center' }}>
          {['For Brands','Blog','FAQs'].map(l => (
            <a key={l} href="#" style={{ color:linkColor,textDecoration:'none',fontSize:15,fontWeight:500,opacity:.85,transition:'opacity 0.2s' }}
              onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=.85}>{l}</a>
          ))}
        </div>

        <div style={{ display:'flex',alignItems:'center',gap:12 }}>
          <a href="#" className="btn-pink desktop-only" style={{ padding:'10px 22px',fontSize:14 }}>{tweaks.ctaLabel}</a>
          {/* Hamburger */}
          <button className="mobile-only" onClick={() => setMenuOpen(o => !o)}
            style={{ background:'none',border:'none',cursor:'pointer',padding:6,display:'flex',flexDirection:'column',gap:5 }}>
            <div style={{ width:22,height:2,background:linkColor,transition:'all 0.3s',transform:menuOpen?'rotate(45deg) translate(5px,5px)':'none' }}></div>
            <div style={{ width:22,height:2,background:linkColor,transition:'all 0.3s',opacity:menuOpen?0:1 }}></div>
            <div style={{ width:menuOpen?22:16,height:2,background:linkColor,transition:'all 0.3s',transform:menuOpen?'rotate(-45deg) translate(5px,-5px)':'none' }}></div>
          </button>
        </div>
      </div>

      {/* Mobile drawer */}
      <div style={{ overflow:'hidden',maxHeight:menuOpen?400:0,transition:'max-height 0.35s ease',background:'rgba(255,255,255,0.97)' }}>
        <div style={{ padding:'8px 20px 28px' }}>
          {['For Brands','Blog','FAQs'].map(l => (
            <a key={l} href="#" style={{ display:'block',color:'#111',textDecoration:'none',fontSize:17,fontWeight:600,padding:'15px 0',borderBottom:'1px solid #f0f0f0' }}>{l}</a>
          ))}
          <a href="#" className="btn-pink" style={{ marginTop:20,padding:'14px 24px',fontSize:15,width:'100%',justifyContent:'center',display:'flex' }}>{tweaks.ctaLabel}</a>
        </div>
      </div>
    </nav>
  );
}

          {os === 'android' ? 'Get it on' : 'Download on the'}
        </div>
        <div style={{ fontSize:17,color:'#fff',fontWeight:700,lineHeight:1.3 }}>{tweaks.smartDownloadLabel}</div>
      </div>
    </a>
  );
}

/* ─── HERO ─────────────────────────────────────────────────────────────── */

/* ─── NUMBERS STRIP ────────────────────────────────────────────────────── */
function useCountUp(target, active, duration = 2000) {
  const [count, setCount] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = 0;
    const step = target / (duration / 16);
    const timer = setInterval(() => {
      start += step;
      if (start >= target) { setCount(target); clearInterval(timer); }
      else setCount(Math.floor(start));
    }, 16);
    return () => clearInterval(timer);
  }, [active, target, duration]);
  return count;
}

function NumberStat({ value, suffix, label }) {
  const ref = useRef();
  const [active, setActive] = useState(false);
  const count = useCountUp(value, active);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setActive(true); }, { threshold: 0.3 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} className="num-item" style={{ textAlign:'center', flex:'1 1 160px' }}>
      <div style={{ fontSize:'clamp(34px,4vw,54px)',fontWeight:900,color:'#fff',letterSpacing:'-0.03em',lineHeight:1 }}>
        {count.toLocaleString('en-IN')}{suffix}
      </div>
      <div style={{ fontSize:13,fontWeight:600,color:'rgba(255,255,255,0.7)',marginTop:8,letterSpacing:'0.06em',textTransform:'uppercase' }}>{label}</div>
    </div>
  );
}

          <a key={l} href="#" style={{ display:'block',fontSize:14,color:'rgba(255,255,255,0.4)',textDecoration:'none',marginBottom:12,lineHeight:1,transition:'color 0.2s' }}
            onMouseEnter={e=>e.target.style.color='rgba(255,255,255,0.8)'} onMouseLeave={e=>e.target.style.color='rgba(255,255,255,0.4)'}>{l}</a>
        ))}
      </div>
    );
  }
  return (
    <div style={{ borderBottom:'1px solid rgba(255,255,255,0.07)' }}>
      <button onClick={() => setOpen(o=>!o)} style={{ width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 0',background:'none',border:'none',cursor:'pointer' }}>
        <span style={{ fontSize:13,fontWeight:700,color:'rgba(255,255,255,0.9)',letterSpacing:'0.06em',textTransform:'uppercase' }}>{title}</span>
        <span style={{ color:'rgba(255,255,255,0.4)',fontSize:18,transition:'transform 0.25s',transform:open?'rotate(45deg)':'none',display:'inline-block',lineHeight:1 }}>+</span>
      </button>
      <div style={{ overflow:'hidden',maxHeight:open?300:0,transition:'max-height 0.3s ease' }}>
        <div style={{ paddingBottom:16 }}>
          {links.map(l => (
            <a key={l} href="#" style={{ display:'block',fontSize:14,color:'rgba(255,255,255,0.4)',textDecoration:'none',marginBottom:14,lineHeight:1 }}>{l}</a>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─── APP ──────────────────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply accent color CSS variable
  useEffect(() => {
    document.documentElement.style.setProperty('--accent-from', tweaks.accentFrom);
    document.documentElement.style.setProperty('--accent-to', tweaks.accentTo);
    // Update all pink-gradient elements
    const style = document.getElementById('dynamic-accent-style') || document.createElement('style');
    style.id = 'dynamic-accent-style';
    style.textContent = `
      .pink-gradient { background: linear-gradient(135deg, ${tweaks.accentFrom} 0%, ${tweaks.accentTo} 100%) !important; }
      .btn-pink { background: linear-gradient(135deg, ${tweaks.accentFrom}, ${tweaks.accentTo}) !important; }
      .campaign-card::after { background: linear-gradient(135deg, ${tweaks.accentFrom}, ${tweaks.accentTo}) !important; }
    `;
    document.head.appendChild(style);
  }, [tweaks.accentFrom, tweaks.accentTo]);

  return (
    <>
      <Nav tweaks={tweaks} />
      <main>
        <Hero tweaks={tweaks} />
        {tweaks.showNumbersStrip && <NumbersStrip tweaks={tweaks} />}
        <EarnSection />
        <SaveSection />
        {tweaks.showExperiences && <ExperiencesSection />}
        <CreatorContentSection />
        <AppDownloadSection tweaks={tweaks} />
        <TrustStrip />
      </main>
      <Footer />
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection label="Brand">
          <TweakColor id="accentFrom" label="Accent start" tweaks={tweaks} setTweak={setTweak} />
          <TweakColor id="accentTo" label="Accent end" tweaks={tweaks} setTweak={setTweak} />
        </TweakSection>
        <TweakSection label="Hero">
          <TweakText id="heroHeadline" label="Headline" tweaks={tweaks} setTweak={setTweak} />
          <TweakText id="heroSub" label="Subline (mobile)" tweaks={tweaks} setTweak={setTweak} />
          <TweakText id="ctaLabel" label="Nav CTA label" tweaks={tweaks} setTweak={setTweak} />
        </TweakSection>
        <TweakSection label="App Download">
          <TweakText id="smartDownloadLabel" label="Mobile button label" tweaks={tweaks} setTweak={setTweak} />
          <TweakText id="appStoreUrl" label="App Store URL" tweaks={tweaks} setTweak={setTweak} />
          <TweakText id="playStoreUrl" label="Play Store URL" tweaks={tweaks} setTweak={setTweak} />
        </TweakSection>
        <TweakSection label="Sections">
          <TweakToggle id="showNumbersStrip" label="Numbers strip" tweaks={tweaks} setTweak={setTweak} />
          <TweakToggle id="showExperiences" label="Experiences slider" tweaks={tweaks} setTweak={setTweak} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
